# S1: slipstream + msgd как единица развёртывания (ARCH §4).
# msgd разделяет network namespace slipstream; backend всегда 127.0.0.1:7000.
# Наружу только DNS-порт. Секреты — ro-mounts, никогда COPY в образ.
name: dmsg53

services:
  slipstream:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.slipstream
    image: dmsg53-slipstream:s1
    command:
      - --dns-listen-port=${DNS_INTERNAL_PORT:-5353}
      - --domain=${DMSG_DOMAIN:?DMSG_DOMAIN is required}
      - --target-address=${MSGD_ADDR:-127.0.0.1:7000}
      - --cert=/run/secrets/carrier_cert.pem
      - --key=/run/secrets/carrier_key.pem
      - --reset-seed=/run/secrets/reset_seed.hex
      - --max-connections=32
      - --idle-timeout-seconds=30
    ports:
      - "${DNS_BIND_IP:?DNS_BIND_IP is required}:${DNS_PUBLIC_PORT:-53}:${DNS_INTERNAL_PORT:-5353}/udp"
    networks:
      default:
        ipv4_address: "${DMSG_SLIPSTREAM_IPV4:?DMSG_SLIPSTREAM_IPV4 is required}"
    secrets:
      - source: carrier_cert.pem
        target: carrier_cert.pem
        mode: 0444
      - source: carrier_key.pem
        target: carrier_key.pem
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: reset_seed.hex
        target: reset_seed.hex
        uid: "65532"
        gid: "65532"
        mode: 0400
    restart: unless-stopped
    # Healthcheck нет: distroless без shell, у slipstream нет HTTP.
    # Живость пути проверяет S3-диагностика через msgd.

  msgd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.msgd
    image: dmsg53-msgd:s1
    network_mode: "service:slipstream"
    depends_on:
      - slipstream
    environment:
      DMSG_DOMAIN: "${DMSG_DOMAIN:?DMSG_DOMAIN is required}"
      MSGD_LISTEN: "127.0.0.1:7000"
      MSGD_DATA_DIR: /var/lib/msgd
      MSGD_BLOBS_DIR: /var/lib/msgd/blobs
      MSGCTL_SOCK: /var/lib/msgd/msgctl.sock
      NOISE_KEY_FILE: /run/secrets/noise_key
      CARRIER_CERT_FILE: /run/secrets/carrier_cert.pem
    secrets:
      - source: noise_key
        target: noise_key
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: carrier_cert.pem
        target: carrier_cert.pem
        mode: 0444
    volumes:
      - msgd-data:/var/lib/msgd
      - blobs-data:/var/lib/msgd/blobs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/msgd", "msgctl", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  msgd-data:
  blobs-data:

networks:
  default:
    ipam:
      config:
        - subnet: "${DMSG_NETWORK_SUBNET:?DMSG_NETWORK_SUBNET is required}"
          # Keep the static endpoint outside the dynamic pool: a stale DNAT
          # must never send DNS to another automatically allocated container.
          ip_range: "${DMSG_NETWORK_DYNAMIC_RANGE:?DMSG_NETWORK_DYNAMIC_RANGE is required}"

secrets:
  carrier_cert.pem:
    file: ${SECRETS_DIR:-./secrets}/carrier_cert.pem
  carrier_key.pem:
    file: ${SECRETS_DIR:-./secrets}/carrier_key.pem
  reset_seed.hex:
    file: ${SECRETS_DIR:-./secrets}/reset_seed.hex
  noise_key:
    file: ${SECRETS_DIR:-./secrets}/noise_key
