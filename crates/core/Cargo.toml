[package]
name = "dmsg-core"
version = "0.1.0"
edition = "2021"
description = "dmsg client core K1-K3: transport seam, supervisor, local store, enrol, Olm E2E, contacts, outbox (direct Rust API, no FFI)"

[dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "time", "sync"] }
dmsg-protocol = { path = "../protocol" }
rusqlite = { version = "0.32", features = ["bundled"] }
snow = "0.10"
sha2 = "0.10"
base64 = "0.22"
vodozemac = "0.11"
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
getrandom = "0.3"
uniffi = { version = "0.29", features = ["build"] }

[lib]
name = "dmsg_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
uniffi_bindgen = "0.29"
camino = "1"
