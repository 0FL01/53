[package]
name = "msgd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "time", "sync"] }
dmsg-protocol = { path = "../protocol" }
rusqlite = { version = "0.32", features = ["bundled"] }
snow = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
getrandom = "0.3"
argon2 = "0.5"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
snow = "0.10"
dmsg-protocol = { path = "../protocol" }
rqrr = { version = "0.10", default-features = false }
